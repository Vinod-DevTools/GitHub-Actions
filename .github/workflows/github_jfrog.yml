name: Python Build and JFrog Upload

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r my-flask-app/requirements.txt
          pip install pytest

      - name: Run Tests
        run: pytest my-flask-app/tests/

      - name: Package Build Artifacts
        run: |
          mkdir -p build
          cp -r my-flask-app/* build/
          cp my-flask-app/requirements.txt build/

      - name: Configure JFrog CLI
        run: |
          jf config add my-server \
            --url ${{ secrets.JF_URL }} \
            --user ${{ secrets.JF_USER }} \
            --password ${{ secrets.JF_PASS }} \
            --interactive=false

      - name: Upload artifacts to JFrog
        run: |
          jf rt upload "build/*" my-repo/python-app/ \
            --build-name=my-flask-app \
            --build-number=${{ github.run_number }}

      - name: Publish build info
        run: |
          jf rt build-publish my-flask-app ${{ github.run_number }}
