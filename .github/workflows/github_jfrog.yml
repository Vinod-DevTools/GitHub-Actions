name: Python CI-CD to JFrog

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install Dependencies
        working-directory: my-flask-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run tests with pytest
      - name: Run Tests
        working-directory: my-flask-app
        run: pytest

      # 5. Package code as artifact (zip/tar.gz)
      - name: Create Build Artifact
        run: |
          mkdir build
          cp -r my-flask-app/* build/
          cd build && zip -r my-flask-app.zip .

      # 6. Setup JFrog CLI
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v3

      # 7. Configure JFrog CLI with secrets
      - name: Configure JFrog CLI
        run: |
          jf config add my-jfrog-server \
            --url ${{ secrets.JF_URL }} \
            --user ${{ secrets.JF_USER }} \
            --password ${{ secrets.JF_PASSWORD }} \
            --interactive=false

      # 8. Upload artifact to JFrog Artifactory
      - name: Upload Artifacts to JFrog
        run: |
          jf rt upload "build/my-flask-app.zip" "data-devin-python-local/" \
            --server-id my-jfrog-server
