name: Build and Upload to JFrog

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd my-flask-app
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd my-flask-app
          pytest

      # ✅ Install JFrog CLI
      - name: Install JFrog CLI
        run: |
          curl -fL https://getcli.jfrog.io | sh
          sudo mv jfrog /usr/local/bin/jf
          jf --version

      # ✅ Configure JFrog connection
      - name: Configure JFrog
        run: |
          jf config add my-server \
            --url ${{ secrets.JF_URL }} \
            --user ${{ secrets.JF_USER }} \
            --password ${{ secrets.JF_PASSWORD }} \
            --interactive=false

      # ✅ Upload artifacts (example: requirements.txt & Flask app files)
      - name: Upload artifacts to JFrog
        run: |
          jf rt upload "my-flask-app/*.py" data-devin-python-local/
          jf rt upload "my-flask-app/requirements.txt" data-devin-python-local/

      # ✅ Publish build info
      - name: Publish build info
        run: |
      - name: Collect Build Env
        run: jf rt build-collect-env my-flask-app-build 1

      - name: Add Build Artifacts
        run: jf rt build-add my-flask-app-build 1 build/

      - name: Publish Build
        run: jf rt build-publish my-flask-app-build 1

