name: Python CI-CD to JFrog

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      # 3. Install dependencies
      - name: Install Dependencies
        working-directory: my-flask-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build  # needed for packaging

      # 4. Run tests with pytest
      - name: Run Tests
        working-directory: my-flask-app
        run: pytest

      # 5. Build Python package (wheel + tar.gz)
      - name: Build Package
        working-directory: my-flask-app
        run: |
          python -m build
          ls dist/

      # 6. Setup JFrog CLI
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v3

      # 7. Configure JFrog CLI with secrets
      - name: Configure JFrog CLI
        run: |
          jf config add my-jfrog-server \
            --url ${{ secrets.JF_URL }} \
            --user ${{ secrets.JF_USER }} \
            --password ${{ secrets.JF_PASSWORD }} \
            --interactive=false

      # 8. Upload Python artifacts (.whl / .tar.gz) to JFrog
      - name: Upload Artifacts to JFrog
        working-directory: my-flask-app
        run: |
          jf rt upload "dist/*" "data-devin-python-local/" \
            --server-id my-jfrog-server
