name: Build and Upload to JFrog

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd my-flask-app
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd my-flask-app
          pytest

      # ✅ Install JFrog CLI
      - name: Install JFrog CLI
        run: |
          curl -fL https://getcli.jfrog.io | sh
          sudo mv jfrog /usr/local/bin/jf
          jf --version

      # ✅ Configure JFrog connection
      - name: Configure JFrog
        run: |
          jf config add my-server \
            --url ${{ secrets.JF_URL }} \
            --user ${{ secrets.JF_USER }} \
            --password ${{ secrets.JF_PASSWORD }} \
            --interactive=false

      # ✅ Upload artifacts to JFrog
      - name: Upload artifacts
        run: |
          jf rt upload "my-flask-app/*.py" data-devin-python-local/ --build-name=my-flask-app-build --build-number=1
          jf rt upload "my-flask-app/requirements.txt" data-devin-python-local/ --build-name=my-flask-app-build --build-number=1

      # ✅ Collect build info and publish
      - name: Collect and Publish Build Info
        run: |
          jf rt build-collect-env my-flask-app-build 1
          jf rt build-add my-flask-app-build 1
          jf rt build-publish my-flask-app-build 1
